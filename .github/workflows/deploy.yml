name: Build and Deploy

on: push

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      # Google Cloud SDKのセットアップ
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.PROJECT_ID }}
          service_account_key: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          export_default_credentials: true

      # Artifact Registry用Docker認証
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.REGION }}-docker.pkg.dev --project=${{ vars.PROJECT_ID }}

      # バックエンドイメージのビルド＆プッシュ
      - name: Build and push backend image
        run: |
          docker build -t ${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.REPO_NAME }}/${{ vars.BACKEND_IMAGE }}:latest ./backend
          docker push ${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.REPO_NAME }}/${{ vars.BACKEND_IMAGE }}:latest
      # バックエンドサービスのデプロイとURL取得
      - name: Deploy backend service to Cloud Run
        id: deploy-backend
        run: |
          gcloud run deploy ${{ vars.BACKEND_IMAGE }} \
            --image=${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.REPO_NAME }}/${{ vars.BACKEND_IMAGE }}:latest \
            --region=${{ vars.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars GOOGLE_APPLICATION_CREDENTIALS=${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }},JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }},GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},FIRESTORE_PROJECT_ID=${{ vars.FIRESTORE_PROJECT_ID }},FRONTEND_URL=${{ vars.FRONTEND_URL }} \
            --quiet
          
          # Get backend service URL
          BACKEND_URL=$(gcloud run services describe ${{ vars.BACKEND_IMAGE }} --region=${{ vars.REGION }} --format='value(status.url)')
          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV