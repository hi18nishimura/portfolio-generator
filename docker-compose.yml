services:
  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: npm start
    tty: true
    stdin_open: true

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    secrets:
      - db_account.json
    tty: true
    stdin_open: true

secrets:
  db_account.json:
    file: backend/db_account.json