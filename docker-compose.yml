version: '3.9'
services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:8000
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    secrets:
      - db_account.json
secrets:
  db_account.json:
    file: backend/db_account.json